group: Wiring
cases:
  - id: wiring-unnamed-net
    title: Unnamed Net
    description: A direct assignment between ports has nothing more to say about the net than the two ports already show, so no label appears on the wire. Since there's no wire declared for it either, cutting this net still leaves it freely renameable.
    tags: [wiring, net-label]
    files:
      top.sv: |
        module top (
          input logic a,
          output logic y
        );
          assign y = a;
        endmodule
    module: top
    target:
      kind: netLabel
      signal: "y"
    expect:
      nodeKinds: [port]
      labelText: null

  - id: wiring-named-net
    title: Named Net
    description: An explicitly declared internal wire's name doesn't match either port it connects, so it shows directly on the wire, even though the net was never cut.
    tags: [wiring, net-label]
    files:
      top.sv: |
        module top (
          input logic a,
          output logic y
        );
          wire x;
          assign x = a;
          assign y = x;
        endmodule
    module: top
    target:
      kind: netLabel
      signal: "y"
    expect:
      nodeKinds: [port]
      labelText: "x"

  - id: wiring-multiple-aliases
    title: Multiple Aliases
    description: A chain of assigns through several named wires collapses into a single net. The first-declared wire's name labels the wire directly; any other internal wire name it passed through (but not the ports at either end, which are already visible) shows up on hover over the asterisk.
    tags: [wiring, net-label]
    files:
      top.sv: |
        module top (
          input logic a,
          output logic y
        );
          wire x1, x2;
          assign x1 = a;
          assign x2 = x1;
          assign y = x2;
        endmodule
    module: top
    target:
      kind: netLabel
      signal: "y"
    expect:
      nodeKinds: [port]
      labelText: "x1"
      aliasNames: ["x2"]
