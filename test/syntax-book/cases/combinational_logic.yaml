  - id: zext-case-arm
    title: Zero-Extension
    description: A case arm whose driving signal is narrower than the mux's resolved output width gets an explicit zero-extension block inserted between the source and the mux input, instead of silently implying a same-width connection.
    tags: [zext, mux, combinational, case, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [1:0] sel,
          input logic a,
          input logic b,
          output logic [7:0] y
        );
          always_comb begin
            case (sel)
              2'b00: y = (a < b);
              default: y = 8'h00;
            endcase
          end
        endmodule
    module: top
    target:
      kind: node
      nodeKind: zext
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, comparator, zext, mux]
      selectedText: |
        case (sel)
              2'b00: y = (a < b);
              default: y = 8'h00;
            endcase

  - id: inverter-expression
    title: Bitwise Inversion
    description: A bitwise NOT operator becomes an inverter gate.
    tags: [inverter, unary, source-highlight]
    files:
      top.sv: |
        module top (
          input logic a,
          output logic y
        );
          assign y = ~a;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: inverter
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, inverter]
      selectedText: "assign y = ~a;"

  - id: latch-inference
    title: Latch Inference
    description: An incomplete conditional assignment inside always_comb infers a latch.
    tags: [latch, sequential, source-highlight]
    files:
      top.sv: |
        module top (
          input logic enable,
          input logic d,
          output logic q
        );
          always_comb begin
            if (enable) begin
              q = d;
            end
          end
        endmodule
    module: top
    target:
      kind: node
      nodeKind: latch
      nodeLabel: q
      action: doubleClick
    expect:
      nodeKinds: [port, latch]
      selectedText: |
        always_comb begin
            if (enable) begin
              q = d;
            end
          end

