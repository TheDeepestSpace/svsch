    tags: [replicate, source-highlight]
    files:
      top.sv: |
        module top (
          input logic some_wire,
          output logic [19:0] repeated
        );
          assign repeated = {20{some_wire}};
        endmodule
    module: top
    target:
      kind: node
      nodeKind: replicate
      nodeLabel: "x20"
      action: doubleClick
    expect:
      nodeKinds: [port, replicate]
      selectedText: "{20{some_wire}"

  - id: loop-for-loop
    title: For Loop Block
    description: A procedural for loop becomes a loop block.
    tags: [loop, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [3:0] in,
          output logic [3:0] out
        );
          always_comb begin
            out = 4'b0;
            for (int i = 0; i < 4; i++) begin
              out[i] = in[i];
            end
          end
        endmodule
    module: top
    target:
      kind: node
      nodeKind: loop
      nodeLabel: "loop"
      action: doubleClick
    expect:
      nodeKinds: [port, loop]
      selectedText: "for"
