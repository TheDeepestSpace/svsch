group: Combinational Logic
cases:
  - id: comb-expression
    title: Combinational Expression
    description: A combinational logic assignment expression that isn't a specialized shape becomes a generic combinational block.
    tags: [comb, logical, source-highlight]
    files:
      top.sv: |
        module top (
          input logic a,
          input logic b,
          output logic decoded
        );
          assign decoded = a * b;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: comb
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, comb]
      selectedText: "assign decoded = a * b;"

  - id: gate-and
    title: Boolean AND Gate
    description: A bitwise AND operator becomes an AND gate.
    tags: [gate, logical, source-highlight]
    files:
      top.sv: |
        module top (
          input logic a,
          input logic b,
          output logic decoded
        );
          assign decoded = a & b;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: gate
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, gate]
      selectedText: "a & b"

  - id: gate-nand-nary
    title: N-ary NAND Gate
    description: Negating an AND chain of the same operator fuses into one n-input NAND gate with a negated-output bubble, instead of a separate inverter feeding a chain of 2-input ANDs.
    tags: [gate, logical, source-highlight]
    files:
      top.sv: |
        module top (
          input logic a,
          input logic b,
          input logic c,
          output logic y
        );
          assign y = ~(a & b & c);
        endmodule
    module: top
    target:
      kind: node
      nodeKind: gate
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, gate]
      selectedText: "~(a & b & c)"

  - id: gate-multibit-and
    title: Multi-bit Boolean AND Gate
    description: A bitwise AND over multi-bit vectors reuses the same AND gate glyph as the single-bit case; only the connecting wires render thicker to signal the wider width.
    tags: [gate, logical, multi-bit, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [3:0] a,
          input logic [3:0] b,
          output logic [3:0] decoded
        );
          assign decoded = a & b;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: gate
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, gate]
      selectedText: "a & b"

  - id: gate-logical-and
    title: Logical AND Gate
    description: The logical AND operator (&&) reduces each operand to a boolean value first, so it renders with the same AND gate glyph as bitwise AND but always produces a single-bit result, even over multi-bit operands.
    tags: [gate, logical, multi-bit, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [3:0] a,
          input logic [3:0] b,
          output logic y
        );
          assign y = a && b;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: gate
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, gate]
      selectedText: "a && b"

