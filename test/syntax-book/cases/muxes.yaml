group: Muxes
cases:
  - id: mux-case-statement
    title: Case Statement Mux
    description: A multiplexer inferred from a standard SystemVerilog case statement.
    tags: [mux, combinational, case, source-highlight]
    files:
      top.sv: |
        module top (
          input logic sel,
          input logic a,
          input logic b,
          output logic y
        );
          always_comb begin
            case (sel)
              1'b0: y = a;
              default: y = b;
            endcase
          end
        endmodule
    module: top
    target:
      kind: node
      nodeKind: mux
      nodeLabel: "case sel"
      action: doubleClick
    expect:
      nodeKinds: [port, mux]
      selectedText: |
        case (sel)
              1'b0: y = a;
              default: y = b;
            endcase

  - id: mux-complex-case-arm
    title: Mux with Complex Case Arm
    description: A multiplexer inferred from a case statement with multiple matching selector values on a single case arm.
    tags: [mux, combinational, case, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [1:0] sel,
          input logic a,
          input logic b,
          output logic y
        );
          always_comb begin
            case (sel)
              2'b00, 2'b01: y = a;
              default: y = b;
            endcase
          end
        endmodule
    module: top
    target:
      kind: node
      nodeKind: mux
      nodeLabel: "case sel"
      action: doubleClick
    expect:
      nodeKinds: [port, mux]
      selectedText: |
        case (sel)
              2'b00, 2'b01: y = a;
              default: y = b;
            endcase

  - id: mux-ternary-operator
    title: Ternary Operator Mux
    description: A conditional expression becomes a two-way multiplexer.
    tags: [mux, combinational, ternary, source-highlight]
    files:
      top.sv: |
        module top (
          input logic sel,
          input logic a,
          input logic b,
          output logic y
        );
          assign y = sel ? a : b;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: mux
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, mux]
      selectedText: "assign y = sel ? a : b;"

  - id: mux-array-ternary
    title: Array Ternary Mux
    description: A conditional expression selecting between arrays becomes a stacked multiplexer.
    tags: [mux, array, combinational, ternary, source-highlight]
    files:
      top.sv: |
        module top (
          input logic sel,
          input logic [7:0] a [0:1],
          input logic [7:0] b [0:1],
          output logic [7:0] y [0:1]
        );
          assign y = sel ? a : b;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: mux
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, mux]
      targetIsArray: true
      selectedText: "assign y = sel ? a : b;"

  - id: mux-nested-ternary
    title: Nested Ternary Muxes
    description: Nested conditional expressions become cascaded two-way multiplexers.
    tags: [mux, combinational, ternary, nested, source-highlight]
    files:
      top.sv: |
        module top (
          input logic sel1,
          input logic sel2,
          input logic a,
          input logic b,
          input logic c,
          output logic y
        );
          assign y = sel1 ? (sel2 ? a : b) : c;
        endmodule
    module: top
    target:
      kind: node
      nodeKind: mux
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, mux]
      selectedText: "assign y = sel1 ? (sel2 ? a : b) : c;"

  - id: mux-ternary-in-expression
    title: Ternary Inside an Arithmetic Expression
    description: A conditional subexpression becomes a mux feeding its containing ALU.
    tags: [mux, alu, combinational, ternary, source-highlight]
    files:
      top.sv: |
        module top (
          input logic sel,
          input logic a,
          input logic b,
          input logic c,
          output logic y
        );
          assign y = a + (sel ? b : c);
        endmodule
    module: top
    target:
      kind: node
      nodeKind: mux
      nodeLabel: ""
      action: doubleClick
    expect:
      nodeKinds: [port, mux, alu]
      selectedText: "sel ? b : c"

  - id: select-variable-index
    title: Variable Index Selection
    description: Indexing a bus with a variable index signal becomes a select block.
    tags: [select, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [3:0] bus,
          input logic [1:0] sel,
          output logic bit_out
        );
          assign bit_out = bus[sel];
        endmodule
    module: top
    target:
      kind: node
      nodeKind: select
      nodeLabel: "bus[sel]"
      action: doubleClick
    expect:
      nodeKinds: [port, select]
      selectedText: "sel"

  - id: select-variable-width
    title: Variable Index Selection with Width
    description: "Indexing a bus with a variable index and a constant width (using +: syntax) becomes a select block."
    tags: [select, source-highlight]
    files:
      top.sv: |
        module top (
          input logic [15:0] bus,
          input logic [2:0] sel,
          output logic [7:0] byte_out
        );
          assign byte_out = bus[sel * 8 +: 8];
        endmodule
    module: top
    target:
      kind: node
      nodeKind: select
      nodeLabel: "bus[sel * 8+:8]"
      action: doubleClick
    expect:
      nodeKinds: [port, select]
      selectedText: "sel * 8 +: 8"
