group: Modules & Hierarchy
cases:
  - id: submodule-instance
    title: Submodule Instance
    description: Instantiating a submodule creates a hierarchical module instance block.
    tags: [instance, hierarchy, source-highlight]
    files:
      child.sv: |
        module child (
          input logic a,
          output logic b
        );
          assign b = a;
        endmodule
      top.sv: |
        module top (
          input logic a,
          output logic b
        );
          child u_child (.a(a), .b(b));
        endmodule
    module: top
    target:
      kind: node
      nodeKind: instance
      nodeLabel: u_child
      action: doubleClick
    expect:
      nodeKinds: [port, instance]
      selectedText: "child u_child (.a(a), .b(b));"

  - id: submodule-parameterized
    title: Parameterized Submodule Instance
    description: Instantiating a submodule with both default parameters and overridden values.
    tags: [instance, hierarchy, parameter, source-highlight]
    files:
      top.sv: |
        module child #(
          parameter WIDTH = 8,
          parameter DEPTH = 4
        ) (
          input logic [WIDTH-1:0] a,
          output logic [WIDTH-1:0] b
        );
          assign b = a;
        endmodule

        module top (
          input logic [7:0] a,
          output logic [7:0] b
        );
          child #(.WIDTH(8)) u_child (
            .a(a),
            .b(b)
          );
        endmodule
    module: top
    target:
      kind: node
      nodeKind: instance
      nodeLabel: u_child
      action: doubleClick
    expect:
      nodeKinds: [port, instance]
      selectedText: |
        child #(.WIDTH(8)) u_child (
            .a(a),
            .b(b)
          );

  - id: submodule-instance-array
    title: Instance Array
    description: Instantiating a submodule with a [MSB:LSB] range collapses the whole array into a single stacked instance node.
    tags: [instance, hierarchy, array, source-highlight]
    files:
      child.sv: |
        module child (
          input logic a,
          output logic b
        );
          assign b = a;
        endmodule
      top.sv: |
        module top (
          input logic [3:0] a,
          output logic [3:0] b
        );
          logic a_arr [3:0];
          logic b_arr [3:0];

          assign a_arr[0] = a[0];
          assign a_arr[1] = a[1];
          assign a_arr[2] = a[2];
          assign a_arr[3] = a[3];

          child u_child [3:0] (
            .a (a_arr),
            .b (b_arr)
          );

          assign b[0] = b_arr[0];
          assign b[1] = b_arr[1];
          assign b[2] = b_arr[2];
          assign b[3] = b_arr[3];
        endmodule
    module: top
    target:
      kind: node
      nodeKind: instance
      nodeLabel: u_child
      action: doubleClick
    expect:
      nodeKinds: [port, instance]
      targetIsArray: true
      selectedText: "u_child"
