group: Other
cases:
  - id: unknown-construct
    title: Unknown Construct
    description: An unsupported procedural block is rendered as an unknown node.
    tags: [unknown, source-highlight]
    files:
      top.sv: |
        module top (
          input logic a,
          output logic y
        );
          assign y = a;
          initial begin
            $display("hello");
          end
        endmodule
    module: top
    target:
      kind: node
      nodeKind: unknown
      nodeLabel: initial
      action: doubleClick
    expect:
      nodeKinds: [port, unknown]
      selectedText: |
        initial begin
            $display("hello");
          end

  - id: function-call-block
    title: Function Call Block
    description: >-
      Calling an automatic function renders the call site as a FUNCTION
      block; double-clicking it unfolds the function's own combinational
      body in place.
    tags: [function, callable, display]
    files:
      top.sv: |
        module top (
          input  logic [7:0] a,
          input  logic [7:0] b,
          output logic [7:0] y
        );
          function automatic [7:0] foo(
            input [7:0] lhs,
            input [7:0] rhs
          );
            foo = lhs + rhs;
          endfunction

          assign y = foo(a, b);
        endmodule
    module: top
    target:
      kind: display
      nodeKind: funcCall
      nodeLabel: foo
    expect:
      nodeKinds: [port, funcCall]

  - id: task-call-block
    title: Task Call Block
    description: >-
      Calling an automatic task from a procedural block renders the call
      site as a TASK block, styled the same as a function call.
    tags: [task, callable, display]
    files:
      top.sv: |
        module top (
          input  logic [7:0] a,
          input  logic [7:0] b,
          output logic [7:0] y
        );
          task automatic add_values(
            input  logic [7:0] lhs,
            input  logic [7:0] rhs,
            output logic [7:0] result
          );
            result = lhs + rhs;
          endtask

          always_comb begin
            add_values(a, b, y);
          end
        endmodule
    module: top
    target:
      kind: display
      nodeKind: taskCall
      nodeLabel: add_values
    expect:
      nodeKinds: [port, taskCall]
