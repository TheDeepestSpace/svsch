# Allowlist for the sub-threshold snapshot rejection gate
# (scripts/check-snapshot-updates.ts).
#
# The gate assumes any baseline diff smaller than the suite's threshold is
# noise and rejects it. Use this file only when that assumption is wrong —
# a real, reviewed rendering change happens to land under the threshold.
#
# Each entry is single-use: it is pinned to one PR, one file, and the exact
# diff pixel count observed, so it cannot be replayed against a later or
# larger change to the same file.
