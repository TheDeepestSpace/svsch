# Source-selection → diagram-node highlight cases (the inverse of the syntax
# book): each case selects a snippet of SystemVerilog text in a fixture file
# and declares which diagram node(s) must light up in the open module's
# diagram. Driven by test/system/sourceSelectionHighlight.spec.ts.
#
# Fields per case:
#   id      unique slug
#   module  module to open in the SVSCH diagram (from test/fixtures)
#   file    workspace-relative path of the file to select text in
#   select  exact text to select (first occurrence in the file)
#   expect  highlighted-node specs; each needs `kind`, `label` optional
#           (several kinds — gate, alu, comb, … — always carry an empty label)
#   exclusive  when false, extra highlighted nodes beyond `expect` are
#              tolerated (default true: the highlighted set must match
#              `expect` exactly)
#
# netLabel nodes are deliberately absent: they are synthesized for cut nets
# and carry no source range, so no editor selection can ever map to one.
# module/boundaryPort are client-side expand artifacts with the same property.
cases:
  - id: port-input-declaration
    module: register_async_reset
    file: fixtures/register_async_reset.sv
    select: 'input logic c_main'
    expect:
      - kind: port
        label: c_main

  - id: register-always-ff-block
    module: register_async_reset
    file: fixtures/register_async_reset.sv
    select: 'always_ff @(posedge c_main or posedge rst) begin'
    expect:
      - kind: register
        label: q

  - id: latch-always-comb-block
    module: latch_simple
    file: fixtures/latch_simple.sv
    select: 'always_comb'
    expect:
      - kind: latch
        label: q

  - id: alu-add-expression
    module: alu_connected
    file: fixtures/alu_connected.sv
    select: 'a + b'
    expect:
      - kind: alu

  - id: comb-multiply-assign
    module: comb_connected
    file: fixtures/comb_connected.sv
    select: 'assign decoded = a * b;'
    expect:
      - kind: comb

  - id: mux-ternary-assign
    module: mux_ternary
    file: fixtures/mux_ternary.sv
    select: 'assign y = sel ? a : b;'
    expect:
      - kind: mux

  - id: gate-and-chain
    module: logical_gate_chains
    file: fixtures/logical_gate_chains.sv
    select: 'a && b && c && d'
    expect:
      - kind: gate

  # "p == q" sits inside the flattened AND gate's own span, so both the
  # comparator leaf and its parent gate light up.
  - id: comparator-inside-gate
    module: logical_gate_chains
    file: fixtures/logical_gate_chains.sv
    select: 'p == q'
    expect:
      - kind: comparator
      - kind: gate

  - id: inverter-not-expression
    module: inverter_expr
    file: fixtures/inverter_expr.sv
    select: '= ~a;'
    expect:
      - kind: inverter

  - id: select-variable-bit
    module: var_bit_select
    file: fixtures/var_bit_select.sv
    select: 'bus[sel]'
    expect:
      - kind: select
        label: 'bus[sel]'

  - id: bus-slice-tap
    module: bus_two_taps
    file: fixtures/bus_two_taps.sv
    select: 'assign opcode = instr[6:0];'
    expect:
      - kind: bus
        label: instr

  # A struct-typed port declaration is both the module port and the struct
  # breakout node, so the one selection lights up both.
  - id: struct-port-breakout
    module: struct_breakout
    file: fixtures/bus_concat.sv
    select: 'input my_struct_t u'
    expect:
      - kind: struct
        label: u
      - kind: port
        label: u

  - id: interface-declaration
    module: interface_modport
    file: fixtures/interface_modport.sv
    select: 'interface simple_if(input logic clk);'
    expect:
      - kind: interface
        label: link

  - id: literal-hex-constant
    module: fsm_literal
    file: fixtures/fsm_literal.sv
    select: "8'h2A"
    expect:
      - kind: literal
        label: "8'h2A"

  - id: replicate-expression
    module: replication_expr
    file: fixtures/replication_expr.sv
    select: '{20{some_wire}}'
    expect:
      - kind: replicate
        label: x20

  - id: instance-instantiation
    module: nest_top
    file: fixtures/expand_nesting_chain.sv
    select: 'nest_level9 u_inner(.a(a), .b(b), .y(y));'
    expect:
      - kind: instance
        label: u_inner

  - id: loop-for-statement
    module: loop_logic
    file: fixtures/loop_logic.sv
    select: 'for (int i = 0; i < 8; i++)'
    expect:
      - kind: loop
        label: loop

  - id: unknown-initial-block
    module: complex
    file: fixtures/unknown.sv
    select: 'initial begin'
    expect:
      - kind: unknown
        label: initial

  # The zero-extend nodes share one source span with the whole case
  # statement, so sibling arm nodes light up alongside them — only the
  # zext presence is pinned here.
  - id: zext-case-arm
    module: alu_case_arms
    file: fixtures/alu_case_arms.sv
    select: "3'b101:  result = (a && b);"
    exclusive: false
    expect:
      - kind: zext

  # Module headers map to no diagram node — selecting one must clear every
  # highlight.
  - id: no-highlight-module-header
    module: mux_ternary
    file: fixtures/mux_ternary.sv
    select: 'module mux_ternary('
    expect: []
