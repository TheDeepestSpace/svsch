<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;

        color: #4a4a4a;
        margin: 8px;

      h1 {

        max-width: 100%;

        font-size: 1.25rem;

        border-top: 1px solid #e1e0d9;
      }

    <title>Backend Coverage</title>
  </head>
  <body>
    <h1>Backend coverage</h1>
    <p class="small">Lines/functions/branches coverage of the C++ backend (gcov/lcov), per master push. Raw data: <a href="history.json">history.json</a>. Per-PR detail: see that PR's stats comment for a link to its own report.</p>
    <img src="trend.svg" alt="Backend coverage trend" />
