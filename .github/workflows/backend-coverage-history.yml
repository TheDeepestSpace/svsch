name: Record Backend Coverage History

# Decoupled from ci.yml itself: this workflow only ever reads that run's
# backend-coverage-final artifact back after the fact, so tracking the
# master-push C++ backend (gcov/lcov) coverage trend (#412) can never touch,
# or regress, the main pipeline — same reasoning ci-duration.yml/
# mem-profile-history.yml give for their own metrics. See
# scripts/backend-coverage-history.mjs /
# scripts/record-backend-coverage-history.mjs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Scoped to this workflow + triggering branch so a newer completed run's
  # history recording cancels an in-flight older one instead of queuing
  # behind it — this only ever contends with itself (the `record` job below
  # only does real work for master, via its own branch filter), not with
  # ci.yml's per-job/per-ref gh-pages groups or the other gh-pages-history
  # workflows, which now each have their own group too (#449). Push races
  # against those are handled by publishBackendCoverageHistory's own
  # retry+backoff instead of a shared lock.
  group: gh-pages-backend-coverage-history-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  record:
    # workflow_run fires for every completed run of CI, including PRs — the
    # "per master push" backend coverage history only tracks push-to-master
    # runs (matching ci-duration.yml's/mem-profile-history.yml's own filter,
    # for the same reason: workflow_run doesn't support filtering by the
    # triggering run's branch/event directly via `on:`).
    if: >
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to download the triggering (not this) run's artifacts below.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install lcov
        # Runs on a bare runner (not ci.yml's dev container image) the same
        # way ci-duration.yml/mem-profile-history.yml do, to stay decoupled
        # from that image's own build pipeline — lcov (needed to parse the
        # downloaded lcov.info below) isn't preinstalled there.
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download backend coverage
        # collect_backend_coverage can produce a missing/empty artifact
        # (every producer job failed before uploading its share) —
        # record-backend-coverage-history.mjs already treats an unreadable
        # lcov.info as "skip this push" rather than a hard error, matching
        # generate-backend-coverage-stats.mjs's own tolerance, so a missing
        # artifact here shouldn't fail the job either.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage-final
          path: coverage/backend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record backend coverage history
        run: node scripts/record-backend-coverage-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          LCOV_INFO_PATH: coverage/backend/lcov.info
