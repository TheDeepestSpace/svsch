name: Release & Publish

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM provenance signing

jobs:
  release:
    if: github.event_name == 'push'
    name: Release & Publish
    runs-on: ubuntu-latest
    # Reusing the existing CI container config from your project
    container:
      image: ghcr.io/thedeepestspace/svsch-ci:latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}

      - name: Install dependencies
        run: npm ci

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This updates package.json and CHANGELOG.md, and consumes changeset files
          version: npx changeset version
          # This publishes the NPM package and the VS Code Marketplace extension
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  attach-vsix:
    # Triggered by the `release` event (fired when changesets/action above creates
    # a GitHub release), not chained onto the `release` job's outputs. This makes it
    # independently retryable via "Re-run failed jobs" without depending on
    # changesets re-detecting a publish, which it won't do on a rerun.
    if: github.event_name == 'release'
    name: Attach VSIX to GitHub Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/svsch-ci:latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Attach VSIX to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: "*.vsix"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
