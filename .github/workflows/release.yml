name: Release & Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)attach a .vsix to, e.g. v1.2.3"
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM provenance signing

jobs:
  release:
    if: github.event_name == 'push'
    name: Release & Publish
    runs-on: ubuntu-latest
    # Reusing the existing CI container config from your project
    container:
      image: ghcr.io/thedeepestspace/svsch-ci:latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}

      - name: Install dependencies
        run: npm ci

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This updates package.json and CHANGELOG.md, and consumes changeset files
          version: npx changeset version
          # This publishes the NPM package
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released tag
        id: resolve-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "tag_name=v$(node -p 'JSON.parse(process.env.PUBLISHED_PACKAGES)[0].version')" >> "$GITHUB_OUTPUT"

  attach-vsix:
    # changesets/action creates the GitHub release using secrets.GITHUB_TOKEN, and
    # GitHub Actions does not start new workflow runs for events caused by
    # GITHUB_TOKEN (release: published included) — only workflow_dispatch and
    # repository_dispatch are exempt. So this job can't be triggered by the
    # `release` event; it instead chains onto `release` within the same push-
    # triggered run, and exposes workflow_dispatch as an independent retry path
    # (pass the tag manually) if packaging/upload fails after publish.
    if: |
      always() &&
      ((github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.published == 'true') ||
       github.event_name == 'workflow_dispatch')
    needs: release
    name: Attach VSIX to GitHub Release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/svsch-ci:latest
    steps:
      - name: Determine release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=$PUSH_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag_name }}
          persist-credentials: false

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package

      - name: Attach VSIX to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: "*.vsix"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
