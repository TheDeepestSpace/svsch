name: Release & Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM provenance signing

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    # Reusing the existing CI container config from your project
    container:
      image: ghcr.io/thedeepestspace/svsch-ci:ci-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}

      - name: Install dependencies
        run: npm ci

      # No separate "setup-node" step here on purpose: the CI container already
      # ships Node 24 / npm 11.12.1 (needed for npm OIDC trusted publishing, which
      # requires npm >= 11.5.1). actions/setup-node@v4 would both downgrade to an
      # older npm and, via registry-url, write an empty _authToken line into
      # .npmrc that makes npm skip the OIDC exchange entirely.

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This updates package.json and CHANGELOG.md, and consumes changeset files
          version: npx changeset version
          # This publishes the NPM package and the VS Code Marketplace extension
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
