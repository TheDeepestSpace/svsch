name: Release & Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for NPM provenance signing

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    # Reusing the existing CI container config from your project
    container:
      image: ghcr.io/thedeepestspace/svsch-ci:ci-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Node for NPM
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This updates package.json and CHANGELOG.md, and consumes changeset files
          version: npx changeset version
          # This publishes the NPM package and the VS Code Marketplace extension
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
