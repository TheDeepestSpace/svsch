name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      ci_image_name: ${{ steps.names.outputs.ci_image_name }}
      dev_image_name: ${{ steps.names.outputs.dev_image_name }}
    steps:
      - name: Set lower case image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ci_image_name=ghcr.io/${REPO_LOWER}-ci" >> $GITHUB_OUTPUT
          echo "dev_image_name=ghcr.io/${REPO_LOWER}-dev" >> $GITHUB_OUTPUT

  build_ci_image:
    needs: prep
    # do this during a push to a branch (e.g. to main) or on a non-fork PR
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.ci_image_name }}
      dockerfile: ./Dockerfile
      target: ci
      tag-prefix: ci-
    secrets: inherit

  build_dev_image:
    needs: [prep, build_ci_image]
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.dev_image_name }}
      dockerfile: ./Dockerfile
      target: dev
      tag-prefix: dev-
    secrets: inherit

  setup:
    needs: [prep, build_ci_image]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: &container_config
      image: ${{ needs.build_ci_image.outputs.image-primary-tag || needs.prep.outputs.ci_image_name }}
    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v4

      - &restore_npm_step
        name: Restore node modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

  build_backend:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Compile Backend
        run: npm run compile:backend

      - name: Upload Backend Binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: dist/svsch_backend

  build_extension:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Lint
        run: npm run lint

      - name: Compile Extension and Webview
        run: |
          CI=true npx vite build
          npx tsc -p tsconfig.extension.json
          SURELOG_AUTO_INSTALL=1 npm run install-surelog

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: |
            dist/
            !dist/svsch_backend

  test_backend:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run Backend Tests
        run: npm run test:backend

  test_unit:
    needs: [prep, build_ci_image, setup, build_extension, build_backend]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - &download_dist_step
        name: Download Dist
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist

      - &download_backend_step
        name: Download Backend
        uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: dist

      - &fix_perms_step
        name: Fix Binary Permissions
        run: |
          chmod +x dist/svsch_backend
          chmod +x dist/surelog/bin/surelog

      - name: Run Unit Tests
        run: npm test

  test_visual:
    needs: [prep, build_ci_image, setup, build_extension, build_backend]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *fix_perms_step

      - &pw_version_step
        name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - &pw_cache_step
        name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - &pw_install_step
        name: Install Playwright Browsers and Deps
        run: npx playwright install --with-deps chromium

      - name: Run Visual Tests
        run: npm run test:visual

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/visual/**
            playwright-report/**
            test/visual/__screenshots__/**

  test_bdd:
    needs: [prep, build_ci_image, setup, build_extension, build_backend]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *fix_perms_step
      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step

      - name: Run BDD Tests
        run: npm run test:bdd

      - name: Upload BDD Documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-documentation
          path: |
            test-results/bdd/**
            test/features/snapshots/**

  test_system:
    needs: [prep, build_ci_image, setup, build_extension, build_backend]
    runs-on: ubuntu-latest
    container: *container_config
    strategy:
      matrix:
        vscode_version: ['1.90.0', '1.91.0', 'stable']
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *fix_perms_step
      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step

      - name: Run System Tests (${{ matrix.vscode_version }})
        run: |
          # Ensure all tools are readable/executable by the dev user
          chmod -R a+rX /usr/local
          mkdir -p /home/dev/tmp
          # Ensure dev can traverse the parent directories of the workspace
          chmod 755 /__w /__w/vscode-svsch
          chown -R dev:dev . /home/dev/tmp
          sudo -u dev -H -E env "PATH=$PATH" "TMPDIR=/home/dev/tmp" npm run test:system
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
      - name: Upload System Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-results-${{ matrix.vscode_version }}
          path: |
            playwright-report/system/**
            test/system/__screenshots__/**

  security_audit:
    needs: [prep, build_ci_image, setup]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run npm audit
        run: npm audit --audit-level=high

  package:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, test_backend, test_unit, test_visual, test_bdd, test_system, security_audit]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *fix_perms_step

      - name: Package Extension
        run: npm run package
        env:
          SURELOG_AUTO_INSTALL: 1

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: "*.vsix"
