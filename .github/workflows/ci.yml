name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      ci_image_name: ${{ steps.names.outputs.ci_image_name }}
      dev_image_name: ${{ steps.names.outputs.dev_image_name }}
      vscode_versions: ${{ steps.versions.outputs.vscode_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          VERSIONS=$(cat vscode-versions.json | tr -d '\n ' )
          echo "vscode_versions=$VERSIONS" >> $GITHUB_OUTPUT
      - name: Set lower case image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ci_image_name=ghcr.io/${REPO_LOWER}-ci" >> $GITHUB_OUTPUT
          echo "dev_image_name=ghcr.io/${REPO_LOWER}-dev" >> $GITHUB_OUTPUT

  build_ci_image:
    needs: prep
    # do this during a push to a branch (e.g. to main) or on a non-fork PR
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.ci_image_name }}
      dockerfile: ./Dockerfile
      target: ci
      tag-prefix: ci-
    secrets: inherit

  build_dev_image:
    needs: [prep, build_ci_image]
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.dev_image_name }}
      dockerfile: ./Dockerfile
      target: dev
      tag-prefix: dev-
    secrets: inherit

  setup:
    needs: [prep, build_ci_image]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: &container_config
      image: ${{ needs.build_ci_image.outputs.image-primary-tag || needs.prep.outputs.ci_image_name }}
    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &restore_npm_step
        name: Restore node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

  build_backend:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Compile Backend
        run: npm run compile:backend

      - name: Upload Backend Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binary
          path: dist/svsch_backend

  build_extension:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Compile Extension and Webview
        run: |
          npm run build:webview
          npx tsc -p tsconfig.extension.json
          SURELOG_AUTO_INSTALL=1 npm run install-surelog

      - name: Upload Dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-dist
          path: |
            dist/
            media/
            !dist/svsch_backend

  build_cli:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Compile CLI
        run: npm run build:cli

      - name: Upload CLI Dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: dist/

  test_backend:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run Backend Tests
        run: npm run test:backend

  test_unit:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - &download_dist_step
        name: Download Dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-dist
          path: .

      - &download_backend_step
        name: Download Backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-binary
          path: dist

      - &download_cli_step
        name: Download CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-dist
          path: dist

      - &fix_perms_step
        name: Fix Binary Permissions
        run: |
          chmod +x dist/svsch_backend
          chmod +x dist/surelog/bin/surelog

      - name: Run Unit Tests
        run: npm test

  test_visual:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step

      - name: Reject sub-threshold visual baseline updates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-snapshot-updates
        with:
          suite: visual

      - &pw_version_step
        name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - &pw_cache_step
        name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - &pw_install_step
        name: Install Playwright Browsers and Deps
        run: npx playwright install --with-deps chromium

      - name: Run Visual Tests (shard ${{ matrix.shard }}/6)
        # --reporter=blob defers HTML/JSON report generation: each shard just
        # records raw results, and merge_visual_reports below combines them
        # into a single report via `playwright merge-reports`.
        run: npm run test:visual -- --shard=${{ matrix.shard }}/6 --reporter=blob

      - name: Rename benchmark result for this shard
        # Every shard writes its subset of samples to the same relative path
        # (test-results/visual/artifacts/benchmark-*.json). Give each shard's
        # copy a unique filename so merge_visual_reports can download every
        # shard's files into one flat directory (via merge-multiple) and
        # aggregate them, instead of one shard's upload silently overwriting
        # another's at a shared name.
        run: |
          cp test-results/visual/artifacts/benchmark-elaboration.json benchmark-elaboration-${{ matrix.shard }}.json
          cp test-results/visual/artifacts/benchmark-rendering.json benchmark-rendering-${{ matrix.shard }}.json

      - name: Upload benchmark result (visual, shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-benchmark-raw-${{ matrix.shard }}
          path: |
            benchmark-elaboration-${{ matrix.shard }}.json
            benchmark-rendering-${{ matrix.shard }}.json

      - name: Upload Playwright blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-blob-report-${{ matrix.shard }}
          path: blob-report/**

      - name: Upload Playwright artifacts (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-playwright-artifacts-${{ matrix.shard }}
          path: |
            test-results/visual/**
            test/visual/__screenshots__/**
            !test-results/visual/artifacts/benchmark-elaboration.json
            !test-results/visual/artifacts/benchmark-rendering.json

  merge_visual_reports:
    # Combines the per-shard blob reports into the same single-report shape
    # (test-results/visual/**, playwright-report/**) a non-sharded run would
    # produce, and aggregates the per-shard benchmark JSON files before
    # pushing them to gh-pages — visual, unlike BDD, tracks a perf benchmark
    # per run, so that push needs to happen once, over the full-suite data,
    # rather than per shard.
    needs: [prep, build_ci_image, setup, test_visual]
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # The benchmark action pushes results to gh-pages on master pushes.
      # PR comments are posted separately by report_benchmarks below.
      contents: write
      # Needed to delete the per-shard artifacts below once they're merged.
      actions: write
    concurrency:
      # Two runs on the same ref (e.g. a retriggered master push) could both
      # auto-push to gh-pages; serialize per-ref so they don't race (PRs/other
      # branches never push, so this doesn't cost them any parallelism).
      group: gh-pages-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download Visual Blob Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-blob-report-*
          path: blob-report
          merge-multiple: true

      - name: Download Visual Test Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-playwright-artifacts-*
          path: .
          merge-multiple: true

      - name: Download Visual Benchmark Data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-benchmark-raw-*
          path: benchmark-raw
          merge-multiple: true

      - name: Merge Visual Reports
        run: npm run test:visual:merge-reports

      - name: Aggregate visual benchmark data across shards
        # Each shard's benchmark-*.json covers a disjoint subset of tests
        # (see test/benchmarkUtils.ts), so combining them is a plain
        # concatenation — no de-duping or averaging needed.
        run: |
          mkdir -p test-results/visual/artifacts
          node scripts/merge-benchmark-json.mjs test-results/visual/artifacts/benchmark-elaboration.json benchmark-raw/benchmark-elaboration-*.json
          node scripts/merge-benchmark-json.mjs test-results/visual/artifacts/benchmark-rendering.json benchmark-raw/benchmark-rendering-*.json

      - &mark_workspace_safe_step
        name: Mark workspace as a safe git directory
        # benchmark-action/github-action-benchmark runs git commands against
        # the checked-out repo; the container user doesn't always own the
        # workspace files, which trips git's dubious-ownership check.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Track diagram-generation benchmark (visual elaboration)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: visual-elaboration-diagram-generation-duration
          tool: customSmallerIsBetter
          output-file-path: test-results/visual/artifacts/benchmark-elaboration.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          # PR comments are posted once, combined across suites, by the
          # report_benchmarks job below instead of per-suite here.
          comment-always: false
          comment-on-alert: false
          fail-on-alert: false

      - name: Reset local gh-pages ref before second benchmark track
        # The elaboration step above left a local `gh-pages` branch ref behind
        # (from its own internal fetch); a second benchmark-action invocation
        # in the same job fetches into that same ref name, and since it's not
        # an ancestor of the freshly fetched remote tip, git rejects it as a
        # non-fast-forward update. Drop it so the rendering step starts clean.
        run: git branch -D gh-pages || true

      - name: Track diagram-generation benchmark (visual rendering)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: visual-rendering-diagram-generation-duration
          tool: customSmallerIsBetter
          output-file-path: test-results/visual/artifacts/benchmark-rendering.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          comment-always: false
          comment-on-alert: false
          fail-on-alert: false

      - name: Upload benchmark result (visual)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-visual
          path: |
            test-results/visual/artifacts/benchmark-elaboration.json
            test-results/visual/artifacts/benchmark-rendering.json

      - name: Upload Merged Playwright Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            test-results/visual/**
            playwright-report/**
            test/visual/__screenshots__/**

      - name: Delete per-shard visual artifacts
        # Once merged into the combined artifacts above, the raw per-shard
        # uploads from test_visual are just clutter in the artifacts list;
        # delete them now that they've been consumed. Only reached if every
        # prior step in this job succeeded.
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId }
            );
            const perShard = artifacts.filter(
              (a) =>
                a.name.startsWith('visual-playwright-artifacts-') ||
                a.name.startsWith('visual-blob-report-') ||
                a.name.startsWith('visual-benchmark-raw-')
            );
            for (const artifact of perShard) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
            core.info(`Deleted ${perShard.length} per-shard visual artifact(s)`);

  test_syntax:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step
      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step

      - name: Run Syntax Book Tests
        run: npm run test:syntax

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syntax-playwright-artifacts
          if-no-files-found: ignore
          path: |
            test-results/syntax-book/**
            playwright-report/**

  test_bdd:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step

      - name: Reject sub-threshold BDD baseline updates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-snapshot-updates
        with:
          suite: bdd

      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step

      - &prepare_vscode_user_step
        name: Prepare non-root user for VS Code
        # vscode-test-playwright launches VS Code (Electron) which must run as the
        # non-root dev user; give it access to the tools and the workspace.
        run: |
          chmod -R a+rX /usr/local
          mkdir -p /home/dev/tmp
          chmod 755 /__w /__w/svsch
          chown -R dev:dev . /home/dev/tmp

      - name: Run BDD Tests (shard ${{ matrix.shard }}/8)
        # --reporter=blob defers cucumber/JSON/HTML report generation: each shard
        # just records raw results, and merge_bdd_reports below combines them into
        # a single report via `playwright merge-reports`.
        run: sudo -u dev -H -E env "PATH=$PATH" "TMPDIR=/home/dev/tmp" npm run test:bdd -- --shard=${{ matrix.shard }}/8 --reporter=blob

      - name: Copy Playwright Results
        if: always()
        run: cp -r /tmp/bdd-playwright-results test-results/bdd/ || true

      - *mark_workspace_safe_step

      - name: Upload BDD Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-artifacts-${{ matrix.shard }}
          path: |
            test-results/bdd/**
            test/features/snapshots/**

      - name: Upload BDD Blob Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-blob-report-${{ matrix.shard }}
          path: blob-report/**

  merge_bdd_reports:
    # Combines the per-shard blob reports into the same single-report shape
    # (test-results/bdd/cucumber/**, test-results/bdd/playwright-report.json,
    # test-results/bdd/step-attachments.json) that generate_bdd_docs and a
    # non-sharded run both already expect, so downstream steps need no changes.
    needs: [prep, build_ci_image, setup, test_bdd]
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # Needed to delete the per-shard artifacts below once they're merged.
      contents: read
      actions: write
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download BDD Blob Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bdd-blob-report-*
          path: blob-report
          merge-multiple: true

      - name: Download BDD Test Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bdd-artifacts-*
          path: .
          merge-multiple: true

      - name: Regenerate BDD spec files
        # `playwright merge-reports` doesn't run globalSetup (which normally
        # invokes bddgen before `playwright test`), and merging happens in a
        # fresh container without each shard's generated spec files under
        # /tmp — regenerate them here so the HTML/JSON reporters can resolve
        # source paths while merging.
        run: npx bddgen --config test/bdd/playwright.config.ts

      - name: Merge BDD Reports
        run: npm run test:bdd:merge-reports

      - name: Upload Merged BDD Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-artifacts
          path: |
            test-results/bdd/**
            test/features/snapshots/**

      - name: Delete per-shard BDD artifacts
        # Once merged into the combined bdd-artifacts / bdd-blob-report-*
        # inputs above, the raw per-shard uploads from test_bdd are just
        # clutter in the artifacts list; delete them now that they've been
        # consumed. Only reached if every prior step in this job succeeded.
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId }
            );
            const perShard = artifacts.filter(
              (a) => a.name.startsWith('bdd-artifacts-') || a.name.startsWith('bdd-blob-report-')
            );
            for (const artifact of perShard) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
            core.info(`Deleted ${perShard.length} per-shard BDD artifact(s)`);

  generate_bdd_docs:
    needs: [prep, build_ci_image, setup, merge_bdd_reports]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download BDD Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bdd-artifacts
          path: .

      - name: Generate BDD Docs
        run: npm run docs:generate

      - name: Upload BDD HTML Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-html-docs
          path: |
            test-results/bdd/**

  test_system:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    strategy:
      matrix:
        vscode_version: ${{ fromJson(needs.prep.outputs.vscode_versions) }}
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step

      - name: Reject sub-threshold system baseline updates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-snapshot-updates
        with:
          suite: system

      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step
      - *prepare_vscode_user_step

      - name: Run System Tests (${{ matrix.vscode_version }})
        run: sudo -u dev -H -E env "PATH=$PATH" "TMPDIR=/home/dev/tmp" npm run test:system:single
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}

      - name: Upload System Test Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-test-results-${{ matrix.vscode_version }}
          path: |
            playwright-report/system/**
            test/system/__screenshots__/**

  report_benchmarks:
    # Posts one PR comment covering diagram-generation benchmark suites
    # (visual), instead of test_visual posting its own. BDD no longer tracks a
    # perf benchmark — see #167 tracking its re-introduction once the
    # busy-indicator timing artifact is fixed.
    needs: [prep, build_ci_image, merge_visual_reports, test_system]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # comment-benchmark-summary.mjs pushes the rendered chart SVGs to
      # gh-pages (a static asset next to the benchmark history data it
      # already publishes there) before posting the PR comment.
      contents: write
      pull-requests: write
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch gh-pages baseline
        # Tolerate the branch not existing yet (first run, before any benchmark
        # has ever published), but let real fetch failures (auth, network) fail
        # the job instead of silently proceeding without a baseline.
        run: |
          set +e
          git ls-remote --exit-code origin gh-pages >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
          elif [ "$status" -eq 2 ]; then
            echo "gh-pages branch not found on remote; continuing without a baseline"
          else
            exit "$status"
          fi

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-*
          path: benchmarks
          # v8 only nests results under a per-artifact subdirectory when more
          # than one artifact matches the pattern (unlike v4.3.0, which always
          # nested). Merge explicitly so the layout stays stable regardless of
          # how many benchmark-* artifacts exist.
          merge-multiple: true

      - name: Post combined benchmark comment
        run: >-
          node scripts/comment-benchmark-summary.mjs
          visual-elaboration-diagram-generation-duration=benchmarks/benchmark-elaboration.json
          visual-rendering-diagram-generation-duration=benchmarks/benchmark-rendering.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  security_audit:
    needs: [prep, build_ci_image, setup]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run npm audit
        uses: ./.github/actions/security-audit

  package_extension:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli, test_backend, test_unit, merge_visual_reports, test_syntax, test_bdd, test_system, security_audit]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step

      - name: Package Extension
        run: npm run package
        env:
          SURELOG_AUTO_INSTALL: 1

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: "*.vsix"

  pack_npm:
    needs: [prep, build_ci_image, setup, build_extension, build_backend, build_cli, test_backend, test_unit, merge_visual_reports, test_syntax, test_bdd, test_system, security_audit]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step

      - name: Pack NPM Tarball
        run: npm pack

      - name: Upload Tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: "*.tgz"

  test_global_install:
    needs: [prep, build_ci_image, pack_npm]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - name: Download Tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: .

      - name: Install Global Package
        run: |
          TGZ_FILE=$(ls *.tgz | head -n 1)
          sudo npm install -g $TGZ_FILE

      - name: Verify Installation
        run: svsch --help
