name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      ci_image_name: ${{ steps.names.outputs.ci_image_name }}
      dev_image_name: ${{ steps.names.outputs.dev_image_name }}
      vscode_versions: ${{ steps.versions.outputs.vscode_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: |
          VERSIONS=$(cat vscode-versions.json | tr -d '\n ' )
          echo "vscode_versions=$VERSIONS" >> $GITHUB_OUTPUT
      - name: Set lower case image names
        id: names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ci_image_name=ghcr.io/${REPO_LOWER}-ci" >> $GITHUB_OUTPUT
          echo "dev_image_name=ghcr.io/${REPO_LOWER}-dev" >> $GITHUB_OUTPUT

  build_ci_image:
    needs: prep
    # do this during a push to a branch (e.g. to main) or on a non-fork PR
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.ci_image_name }}
      dockerfile: ./Dockerfile
      target: ci
      tag-prefix: ci-
    secrets: inherit

  build_dev_image:
    needs: [prep, build_ci_image]
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ needs.prep.outputs.dev_image_name }}
      dockerfile: ./Dockerfile
      target: dev
      tag-prefix: dev-
    secrets: inherit

  setup:
    needs: [prep, build_ci_image]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: &container_config
      image: ${{ needs.build_ci_image.outputs.image-primary-tag || needs.prep.outputs.ci_image_name }}
    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &restore_npm_step
        name: Restore node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'patches/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

  build_backend:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Compile Backend
        run: npm run compile:backend

      - name: Upload Backend Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binary
          path: dist/svsch_backend

  build_backend_coverage:
    # Builds svsch_backend a second time with --coverage instrumentation, in
    # parallel with the plain build_backend above — that job keeps feeding
    # package_extension/pack_npm an untouched production binary; this one
    # feeds test_unit/test_bdd/test_visual/test_syntax/test_system an
    # instrumented binary so their existing runs (not new ones) double as
    # backend coverage collection.
    # Uploads the whole build tree, not just the binary: gcov ties a .gcda's
    # output location to the *build-time absolute path* of its .gcno, so
    # collect_backend_coverage needs that .gcno tree downloaded back to the
    # identical path to pair with the .gcda files those jobs produce.
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Compile Backend (coverage-instrumented)
        run: npm run compile:backend:coverage

      - name: Upload Coverage-Instrumented Backend Build Tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binary-coverage
          path: |
            src/parser/backend_cpp/build-coverage/svsch_backend
            src/parser/backend_cpp/build-coverage/**/*.gcno

  build_extension:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Compile Extension and Webview
        run: |
          npm run build:webview
          npx tsc -p tsconfig.extension.json
          SURELOG_AUTO_INSTALL=1 npm run install-surelog

      - name: Upload Dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-dist
          path: |
            dist/
            media/
            !dist/svsch_backend

  build_cli:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Compile CLI
        run: npm run build:cli

      - name: Upload CLI Dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-dist
          path: dist/

  test_backend:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run Backend Tests
        run: npm run test:backend

  test_backend_coverage:
    needs: [prep, build_ci_image, setup]
    if: always() && (needs.build_ci_image.result == 'success' || needs.build_ci_image.result == 'skipped')
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run Backend Test Coverage
        run: npm run test:backend:coverage

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage/backend/lcov.info

  test_unit:
    needs: [prep, build_ci_image, setup, build_extension, build_backend_coverage, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - &download_dist_step
        name: Download Dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-dist
          path: .

      - &download_backend_coverage_step
        name: Download Coverage-Instrumented Backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-binary-coverage
          path: src/parser/backend_cpp/build-coverage

      - &stage_backend_coverage_step
        name: Stage Coverage-Instrumented Backend Binary
        run: |
          mkdir -p dist
          cp src/parser/backend_cpp/build-coverage/svsch_backend dist/svsch_backend

      - &download_cli_step
        name: Download CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-dist
          path: dist

      - &fix_perms_step
        name: Fix Binary Permissions
        run: |
          chmod +x dist/svsch_backend
          chmod +x dist/surelog/bin/surelog

      - name: Run Unit Tests With Coverage
        run: npm run test:coverage
        env:
          SVSCH_BACKEND_GCOV_ROOT: ${{ github.workspace }}/coverage-raw/unit

      - name: Upload Coverage Report
        # Full coverage/ (lcov.info + the html reporter's annotated report),
        # so the raw report is downloadable even without report_coverage_stats
        # below publishing it to gh-pages (e.g. a fork PR, which can't push
        # there).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: warn

      - name: Upload Backend Coverage Data (unit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-gcda-unit
          path: coverage-raw
          if-no-files-found: ignore

  test_visual:
    needs: [prep, build_ci_image, setup, build_extension, build_backend_coverage, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_coverage_step
      - *stage_backend_coverage_step
      - *download_cli_step
      - *fix_perms_step

      - name: Reject sub-threshold visual baseline updates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-snapshot-updates
        with:
          suite: visual

      - &pw_version_step
        name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - &pw_cache_step
        name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - &pw_install_step
        name: Install Playwright Browsers and Deps
        run: npx playwright install --with-deps chromium

      - name: Run Visual Tests (shard ${{ matrix.shard }}/6)
        # --reporter=blob defers HTML/JSON report generation: each shard just
        # records raw results, and merge_visual_reports below combines them
        # into a single report via `playwright merge-reports`. Wrapped in
        # mem-poller.mjs (#400) so this shard's own RSS-over-time is captured
        # alongside the test run itself, rather than needing a second,
        # separately-timed step.
        run: >-
          node scripts/mem-poller.mjs visual-shard-${{ matrix.shard }}.json --
          npm run test:visual -- --shard=${{ matrix.shard }}/6 --reporter=blob
        env:
          SVSCH_BACKEND_GCOV_ROOT: ${{ github.workspace }}/coverage-raw/visual-${{ matrix.shard }}

      - name: Upload memory profile (visual, shard ${{ matrix.shard }})
        # always(), not just on success — a shard that fails (or gets OOM
        # killed) is exactly the case where its RSS-over-time is most worth
        # keeping.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mem-profile-visual-raw-${{ matrix.shard }}
          path: visual-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

      - name: Upload Backend Coverage Data (visual, shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-gcda-visual-${{ matrix.shard }}
          path: coverage-raw
          if-no-files-found: ignore

      - name: Rename benchmark result for this shard
        # Every shard writes its subset of samples to the same relative path
        # (test-results/visual/artifacts/benchmark-*.json). Give each shard's
        # copy a unique filename so merge_visual_reports can download every
        # shard's files into one flat directory (via merge-multiple) and
        # aggregate them, instead of one shard's upload silently overwriting
        # another's at a shared name.
        run: |
          cp test-results/visual/artifacts/benchmark-elaboration.json benchmark-elaboration-${{ matrix.shard }}.json
          cp test-results/visual/artifacts/benchmark-rendering.json benchmark-rendering-${{ matrix.shard }}.json

      - name: Upload benchmark result (visual, shard ${{ matrix.shard }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-benchmark-raw-${{ matrix.shard }}
          path: |
            benchmark-elaboration-${{ matrix.shard }}.json
            benchmark-rendering-${{ matrix.shard }}.json

      - name: Upload Playwright blob report (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-blob-report-${{ matrix.shard }}
          path: blob-report/**

      - name: Upload Playwright artifacts (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-playwright-artifacts-${{ matrix.shard }}
          path: |
            test-results/visual/**
            test/visual/__screenshots__/**
            !test-results/visual/artifacts/benchmark-elaboration.json
            !test-results/visual/artifacts/benchmark-rendering.json

  merge_visual_reports:
    # Combines the per-shard blob reports into the same single-report shape
    # (test-results/visual/**, playwright-report/**) a non-sharded run would
    # produce, and aggregates the per-shard benchmark JSON files before
    # pushing them to gh-pages — visual, unlike BDD, tracks a perf benchmark
    # per run, so that push needs to happen once, over the full-suite data,
    # rather than per shard.
    needs: [prep, build_ci_image, setup, test_visual]
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # The benchmark action pushes results to gh-pages on master pushes.
      # PR comments are posted separately by report_benchmark_stats below.
      contents: write
      # Needed to delete the per-shard artifacts below once they're merged.
      actions: write
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci-duration.yml, cleanup-video-galleries.yml) so pushes are
      # serialized repo-wide, not just within this workflow/ref (#380).
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download Visual Blob Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-blob-report-*
          path: blob-report
          merge-multiple: true

      - name: Download Visual Test Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-playwright-artifacts-*
          path: .
          merge-multiple: true

      - name: Download Visual Benchmark Data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-benchmark-raw-*
          path: benchmark-raw
          merge-multiple: true

      - name: Merge Visual Reports
        run: npm run test:visual:merge-reports

      - name: Aggregate visual benchmark data across shards
        # Each shard's benchmark-*.json covers a disjoint subset of tests
        # (see test/benchmarkUtils.ts), so combining them is a plain
        # concatenation — no de-duping or averaging needed.
        run: |
          mkdir -p test-results/visual/artifacts
          node scripts/merge-benchmark-json.mjs test-results/visual/artifacts/benchmark-elaboration.json benchmark-raw/benchmark-elaboration-*.json
          node scripts/merge-benchmark-json.mjs test-results/visual/artifacts/benchmark-rendering.json benchmark-raw/benchmark-rendering-*.json

      - &mark_workspace_safe_step
        name: Mark workspace as a safe git directory
        # benchmark-action/github-action-benchmark runs git commands against
        # the checked-out repo; the container user doesn't always own the
        # workspace files, which trips git's dubious-ownership check.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Track diagram-generation benchmark (visual elaboration)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: visual-elaboration-diagram-generation-duration
          tool: customSmallerIsBetter
          output-file-path: test-results/visual/artifacts/benchmark-elaboration.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          # PR comments are posted once, combined across suites, by the
          # report_benchmark_stats job below instead of per-suite here.
          comment-always: false
          comment-on-alert: false
          fail-on-alert: false

      - name: Reset local gh-pages ref before second benchmark track
        # The elaboration step above left a local `gh-pages` branch ref behind
        # (from its own internal fetch); a second benchmark-action invocation
        # in the same job fetches into that same ref name, and since it's not
        # an ancestor of the freshly fetched remote tip, git rejects it as a
        # non-fast-forward update. Drop it so the rendering step starts clean.
        run: git branch -D gh-pages || true

      - name: Track diagram-generation benchmark (visual rendering)
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: visual-rendering-diagram-generation-duration
          tool: customSmallerIsBetter
          output-file-path: test-results/visual/artifacts/benchmark-rendering.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          comment-always: false
          comment-on-alert: false
          fail-on-alert: false

      - name: Trim benchmark history retention
        # github-action-benchmark's auto-push above never prunes dev/bench/data.js,
        # so it grows forever (#258) — cap it to the most recent runs per suite
        # right after the pushes that just grew it.
        if: github.ref == 'refs/heads/master'
        run: node scripts/trim-benchmark-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload benchmark result (visual)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-visual
          path: |
            test-results/visual/artifacts/benchmark-elaboration.json
            test-results/visual/artifacts/benchmark-rendering.json

      - name: Upload Merged Playwright Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            test-results/visual/**
            playwright-report/**
            test/visual/__screenshots__/**

      - name: Delete per-shard visual artifacts
        # Once merged into the combined artifacts above, the raw per-shard
        # uploads from test_visual are just clutter in the artifacts list;
        # delete them now that they've been consumed. Only reached if every
        # prior step in this job succeeded.
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId }
            );
            const perShard = artifacts.filter(
              (a) =>
                a.name.startsWith('visual-playwright-artifacts-') ||
                a.name.startsWith('visual-blob-report-') ||
                a.name.startsWith('visual-benchmark-raw-')
            );
            let deleted = 0;
            for (const artifact of perShard) {
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                deleted++;
              } catch (err) {
                // Best-effort cleanup: a transient GitHub API error (e.g. 502)
                // deleting one artifact shouldn't fail the whole job.
                core.warning(`Failed to delete artifact ${artifact.id} (${artifact.name}): ${err.message}`);
              }
            }
            core.info(`Deleted ${deleted}/${perShard.length} per-shard visual artifact(s)`);

  test_syntax:
    needs: [prep, build_ci_image, setup, build_extension, build_backend_coverage, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_coverage_step
      - *stage_backend_coverage_step
      - *download_cli_step
      - *fix_perms_step
      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step

      - name: Run Syntax Book Tests
        run: npm run test:syntax
        env:
          SVSCH_BACKEND_GCOV_ROOT: ${{ github.workspace }}/coverage-raw/syntax

      - name: Upload Backend Coverage Data (syntax)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-gcda-syntax
          path: coverage-raw
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syntax-playwright-artifacts
          if-no-files-found: ignore
          path: |
            test-results/syntax-book/**
            playwright-report/**

  test_bdd:
    needs: [prep, build_ci_image, setup, build_extension, build_backend_coverage, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    # Historical runs complete in 20-90m; a run that exceeds this has hung
    # (observed: 4+ hours stuck on "Run BDD Tests" with zero step progress)
    # rather than just running slow, so fail fast instead of eating the
    # default 6h job timeout.
    timeout-minutes: 120
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_coverage_step
      - *stage_backend_coverage_step
      - *download_cli_step
      - *fix_perms_step

      - name: Reject sub-threshold BDD baseline updates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-snapshot-updates
        with:
          suite: bdd

      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step

      - &prepare_vscode_user_step
        name: Prepare non-root user for VS Code
        # vscode-test-playwright launches VS Code (Electron) which must run as the
        # non-root dev user; give it access to the tools and the workspace.
        run: |
          chmod -R a+rX /usr/local
          mkdir -p /home/dev/tmp
          chmod 755 /__w /__w/svsch
          chown -R dev:dev . /home/dev/tmp

      - name: Run BDD Tests (shard ${{ matrix.shard }}/8)
        # --reporter=blob defers cucumber/JSON/HTML report generation: each shard
        # just records raw results, and merge_bdd_reports below combines them into
        # a single report via `playwright merge-reports`. Wrapped in
        # mem-poller.mjs (#400), which runs as root (unlike the sudo'd test
        # command it wraps) so it can read every descendant process's
        # /proc/<pid>/stat regardless of which uid (root vs dev) owns it.
        run: >-
          node scripts/mem-poller.mjs bdd-shard-${{ matrix.shard }}.json --
          sudo -u dev -H -E env "PATH=$PATH" "TMPDIR=/home/dev/tmp" npm run test:bdd -- --shard=${{ matrix.shard }}/8 --reporter=blob
        env:
          SVSCH_BACKEND_GCOV_ROOT: ${{ github.workspace }}/coverage-raw/bdd-${{ matrix.shard }}

      - name: Upload memory profile (bdd, shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mem-profile-bdd-raw-${{ matrix.shard }}
          path: bdd-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

      # closeElectronApp sweeps detached NodeService helpers after every test.
      # Keep a shard-end sweep as an invariant/backstop so a future VS Code
      # process shape cannot survive into artifact/cache post-steps (#275).
      - name: Kill stray VS Code processes
        if: always()
        run: |
          echo "--- processes still running under .vscode-test/ ---"
          pgrep -fa '\.vscode-test/' || echo "(none)"
          pkill -9 -f '\.vscode-test/' || true

      - name: Copy Playwright Results
        if: always()
        # Playwright's outputDir (traces, videos, vscode logs, visual-diff
        # images) lives under the test step's TMPDIR (/home/dev/tmp) to dodge
        # v9fs ENOSPC, so it must be moved into the workspace for the artifact
        # upload below. `mv` (not `cp`) so the runner isn't holding two full
        # copies of this data (often hundreds of MB of videos/traces) right
        # up until the job's trailing cache-save steps run — that peak was
        # tipping some shards into ENOSPC (see #275).
        run: |
          for dir in /home/dev/tmp/bdd-playwright-results-*/; do
            [ -d "$dir" ] && mv "$dir" test-results/bdd/playwright-output || true
          done

      - *mark_workspace_safe_step

      - name: Upload Backend Coverage Data (bdd, shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-gcda-bdd-${{ matrix.shard }}
          path: coverage-raw
          if-no-files-found: ignore

      - name: Upload BDD Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-artifacts-${{ matrix.shard }}
          retention-days: 1
          path: |
            test-results/bdd/**
            test/features/snapshots/**

      - name: Upload BDD Blob Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-blob-report-${{ matrix.shard }}
          retention-days: 1
          path: blob-report/**

  merge_bdd_reports:
    # Combines the per-shard blob reports into the same single-report shape
    # (test-results/bdd/cucumber/**, test-results/bdd/playwright-report.json,
    # test-results/bdd/step-attachments.json) that generate_bdd_docs and a
    # non-sharded run both already expect, so downstream steps need no changes.
    needs: [prep, build_ci_image, setup, test_bdd]
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # Needed to delete the per-shard artifacts below once they're merged.
      contents: read
      actions: write
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download BDD Blob Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bdd-blob-report-*
          path: blob-report
          merge-multiple: true

      - name: Download BDD Test Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bdd-artifacts-*
          path: .
          merge-multiple: true

      - name: Regenerate BDD spec files
        # `playwright merge-reports` doesn't run globalSetup (which normally
        # invokes bddgen before `playwright test`), and merging happens in a
        # fresh container without each shard's generated spec files under
        # /tmp — regenerate them here so the HTML/JSON reporters can resolve
        # source paths while merging.
        run: npx bddgen --config test/bdd/playwright.config.ts

      - name: Merge BDD Reports
        run: npm run test:bdd:merge-reports

      - name: Upload Merged BDD Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-artifacts
          retention-days: 7
          path: |
            test-results/bdd/**
            test/features/snapshots/**

      - name: Delete per-shard BDD artifacts
        # Once merged into the combined bdd-artifacts / bdd-blob-report-*
        # inputs above, the raw per-shard uploads from test_bdd are just
        # clutter in the artifacts list; delete them now that they've been
        # consumed. Only reached if every prior step in this job succeeded.
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: context.runId }
            );
            const perShard = artifacts.filter(
              (a) => a.name.startsWith('bdd-artifacts-') || a.name.startsWith('bdd-blob-report-')
            );
            let deleted = 0;
            for (const artifact of perShard) {
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                deleted++;
              } catch (err) {
                // On a job rerun, the listing above can still include an
                // artifact a prior attempt already deleted (API list/delete
                // consistency lag) — a 404 here just means it's gone already,
                // not a real failure, so don't crash the job over it.
                if (err.status === 404) {
                  core.info(`Artifact ${artifact.id} (${artifact.name}) already deleted, skipping`);
                } else {
                  // Best-effort cleanup: a transient GitHub API error (e.g. 502)
                  // deleting one artifact shouldn't fail the whole job.
                  core.warning(`Failed to delete artifact ${artifact.id} (${artifact.name}): ${err.message}`);
                }
              }
            }
            core.info(`Deleted ${deleted}/${perShard.length} per-shard BDD artifact(s)`);

  publish_bdd_videos:
    needs: [merge_bdd_reports]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bdd-video-gallery-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - *checkout_step

      - name: Checkout base ref features
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: bdd-base-checkout
          persist-credentials: false
          sparse-checkout: |
            test/features
          sparse-checkout-cone-mode: false

      - name: Download merged BDD artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bdd-artifacts
          path: gallery-input

      - name: Diff BDD scenarios vs base
        run: |
          node scripts/diff-bdd-scenarios.mjs \
            bdd-scenario-status.json \
            bdd-base-checkout/test/features \
            test/features

      - name: Generate BDD video gallery
        run: node scripts/generate-bdd-video-gallery.mjs gallery-input/test-results/bdd bdd-video-gallery
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BDD_SCENARIO_STATUS_FILE: bdd-scenario-status.json

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: bdd-pages

      - name: Publish BDD videos and gallery
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          gallery_path="dev/bdd-videos/pr-${PR_NUMBER}"

          git -C bdd-pages config user.name "github-actions[bot]"
          git -C bdd-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C bdd-pages rm -r --ignore-unmatch "${gallery_path}"
          mkdir -p "bdd-pages/${gallery_path}"
          cp -R bdd-video-gallery/. "bdd-pages/${gallery_path}/"
          git -C bdd-pages add "${gallery_path}"
          git -C bdd-pages commit -m "Update BDD video gallery for PR #${PR_NUMBER}"

          attempt=1
          while ! git -C bdd-pages push origin HEAD:gh-pages; do
            if [ "$attempt" -ge 3 ]; then
              echo "Failed to publish gh-pages after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            git -C bdd-pages fetch origin gh-pages
            git -C bdd-pages rebase origin/gh-pages
          done

  generate_bdd_docs:
    needs: [prep, build_ci_image, setup, merge_bdd_reports]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download BDD Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bdd-artifacts
          path: .

      - name: Generate BDD Docs
        run: npm run docs:generate

      - name: Upload BDD HTML Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bdd-html-docs
          retention-days: 7
          path: |
            test-results/bdd/**

  test_system:
    needs: [prep, build_ci_image, setup, build_extension, build_backend_coverage, build_cli]
    runs-on: ubuntu-latest
    container: *container_config
    strategy:
      matrix:
        vscode_version: ${{ fromJson(needs.prep.outputs.vscode_versions) }}
      fail-fast: false
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_coverage_step
      - *stage_backend_coverage_step
      - *download_cli_step
      - *fix_perms_step

      - name: Reject sub-threshold system baseline updates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-snapshot-updates
        with:
          suite: system

      - *pw_version_step
      - *pw_cache_step
      - *pw_install_step
      - *prepare_vscode_user_step

      - name: Run System Tests (${{ matrix.vscode_version }})
        # Wrapped in mem-poller.mjs (#400); see the BDD shard step above for
        # why it runs as root around the sudo'd test command rather than
        # inside it.
        run: >-
          node scripts/mem-poller.mjs system-${{ matrix.vscode_version }}.json --
          sudo -u dev -H -E env "PATH=$PATH" "TMPDIR=/home/dev/tmp" npm run test:system:single
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
          SVSCH_BACKEND_GCOV_ROOT: ${{ github.workspace }}/coverage-raw/system-${{ matrix.vscode_version }}

      - name: Upload memory profile (system, ${{ matrix.vscode_version }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mem-profile-system-raw-${{ matrix.vscode_version }}
          path: system-${{ matrix.vscode_version }}.json
          if-no-files-found: warn

      - name: Upload Backend Coverage Data (system, ${{ matrix.vscode_version }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-gcda-system-${{ matrix.vscode_version }}
          path: coverage-raw
          if-no-files-found: ignore

      - name: Upload System Test Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-test-results-${{ matrix.vscode_version }}
          path: |
            playwright-report/system/**
            test/system/__screenshots__/**
            test-results/system/**

  publish_system_videos:
    # Unlike BDD's shards (disjoint scenarios that merge_bdd_reports combines
    # into one report before publishing), each vscode_version matrix leg here
    # reruns the same 5 tests, so there's no cross-leg report merge step to
    # depend on — this job downloads all 3 legs directly and merges them
    # itself (see scripts/merge-system-video-reports.mjs).
    needs: [test_system]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: system-video-gallery-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - *checkout_step

      - name: Download system test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: system-test-results-*
          path: system-input

      - name: Merge system video reports across VS Code versions
        run: |
          set -eu
          args=()
          for artifact_dir in system-input/system-test-results-*/; do
            name=$(basename "$artifact_dir")
            version="${name#system-test-results-}"
            results_dir="${artifact_dir%/}/test-results/system"
            if [ -d "$results_dir" ]; then
              args+=("${version}=${results_dir}")
            fi
          done
          node scripts/merge-system-video-reports.mjs merged-system-input "${args[@]}"

      - name: Generate system video gallery
        run: node scripts/generate-bdd-video-gallery.mjs merged-system-input system-video-gallery
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GALLERY_TITLE: System videos
          GALLERY_HEADING: System test videos
          GALLERY_FEATURE_LABEL: System scenario

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: system-pages

      - name: Publish system videos and gallery
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          gallery_path="dev/system-videos/pr-${PR_NUMBER}"

          git -C system-pages config user.name "github-actions[bot]"
          git -C system-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C system-pages rm -r --ignore-unmatch "${gallery_path}"
          mkdir -p "system-pages/${gallery_path}"
          cp -R system-video-gallery/. "system-pages/${gallery_path}/"
          git -C system-pages add "${gallery_path}"
          git -C system-pages commit -m "Update system video gallery for PR #${PR_NUMBER}"

          attempt=1
          while ! git -C system-pages push origin HEAD:gh-pages; do
            if [ "$attempt" -ge 3 ]; then
              echo "Failed to publish gh-pages after ${attempt} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            git -C system-pages fetch origin gh-pages
            git -C system-pages rebase origin/gh-pages
          done

  comment_video_galleries:
    # Posts one PR comment linking both video galleries, instead of
    # publish_bdd_videos and publish_system_videos each posting their own
    # (mirrors the report_pr_stats pattern below for combining suites into
    # a single comment).
    needs: [publish_bdd_videos, publish_system_videos]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.publish_bdd_videos.result == 'success' || needs.publish_system_videos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Link video galleries from the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BDD_SUCCEEDED: ${{ needs.publish_bdd_videos.result == 'success' }}
          SYSTEM_SUCCEEDED: ${{ needs.publish_system_videos.result == 'success' }}
        with:
          script: |
            const marker = '<!-- test-video-galleries -->';
            const { owner, repo } = context.repo;
            const pr = context.issue.number;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const lines = [];
            if (process.env.BDD_SUCCEEDED === 'true') {
              const gallery = `https://${owner.toLowerCase()}.github.io/${repo}/dev/bdd-videos/pr-${pr}/`;
              lines.push(`[Browse all BDD scenario videos](${gallery}) · [download artifact](${run})`);
            }
            if (process.env.SYSTEM_SUCCEEDED === 'true') {
              const gallery = `https://${owner.toLowerCase()}.github.io/${repo}/dev/system-videos/pr-${pr}/`;
              lines.push(`[Browse all system test videos](${gallery}) · [download artifact](${run})`);
            }

            const body = `${marker}\n${lines.join('\n')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

  report_benchmark_stats:
    # Publishes diagram-generation benchmark charts (visual) to gh-pages and
    # renders this PR's benchmark section as markdown, for report_pr_stats to
    # fold into the combined PR stats comment below — instead of test_visual
    # posting its own comment. BDD no longer tracks a perf benchmark — see
    # #167 tracking its re-introduction once the busy-indicator timing
    # artifact is fixed.
    needs: [prep, build_ci_image, merge_visual_reports, test_system]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # generate-benchmark-stats.mjs pushes the rendered chart SVGs to
      # gh-pages (a static asset next to the benchmark history data it
      # already publishes there).
      contents: write
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci-duration.yml, cleanup-video-galleries.yml) so pushes are
      # serialized repo-wide, not just within this workflow/ref (#380).
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch gh-pages baseline
        # Tolerate the branch not existing yet (first run, before any benchmark
        # has ever published), but let real fetch failures (auth, network) fail
        # the job instead of silently proceeding without a baseline.
        run: |
          set +e
          git ls-remote --exit-code origin gh-pages >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          elif [ "$status" -eq 2 ]; then
            echo "gh-pages branch not found on remote; continuing without a baseline"
          else
            exit "$status"
          fi

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-*
          path: benchmarks
          # v8 only nests results under a per-artifact subdirectory when more
          # than one artifact matches the pattern (unlike v4.3.0, which always
          # nested). Merge explicitly so the layout stays stable regardless of
          # how many benchmark-* artifacts exist.
          merge-multiple: true

      - name: Generate benchmark stats
        run: >-
          node scripts/generate-benchmark-stats.mjs
          benchmark-stats.md
          visual-elaboration-diagram-generation-duration=benchmarks/benchmark-elaboration.json
          visual-rendering-diagram-generation-duration=benchmarks/benchmark-rendering.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload benchmark stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-stats-benchmark
          path: benchmark-stats.md

  report_ci_duration_stats:
    # Renders this run's elapsed wall-clock time so far, plus the recent
    # per-master-push trend (#282), as markdown for report_pr_stats to fold
    # into the combined PR stats comment below — mirrors
    # report_benchmark_stats above, run at the same point in the workflow
    # graph so the "so far" preview covers a comparable share of the run.
    needs: [prep, build_ci_image, merge_visual_reports, test_system]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # generate-ci-duration-stats.mjs pushes the rendered chart SVG to
      # gh-pages (a static asset next to the CI duration history data it
      # already publishes there).
      contents: write
      # Looks up this run's own timing (Actions API) for its "so far"
      # preview point.
      actions: read
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci-duration.yml, cleanup-video-galleries.yml) so pushes are
      # serialized repo-wide, not just within this workflow/ref (#380).
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch gh-pages baseline
        # Tolerate the branch not existing yet (first run, before any CI
        # duration has ever been recorded), but let real fetch failures
        # (auth, network) fail the job instead of silently proceeding
        # without a baseline.
        run: |
          set +e
          git ls-remote --exit-code origin gh-pages >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          elif [ "$status" -eq 2 ]; then
            echo "gh-pages branch not found on remote; continuing without a baseline"
          else
            exit "$status"
          fi

      - name: Generate CI duration stats
        run: node scripts/generate-ci-duration-stats.mjs ci-duration-stats.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Upload CI duration stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-stats-ci-duration
          path: ci-duration-stats.md

  report_memory_stats:
    # Publishes each shard's/leg's raw RSS-over-time timeseries plus a
    # per-shard/leg HTML report to gh-pages, and renders this PR's memory
    # (RSS) profiling section as markdown, for report_pr_stats to fold into
    # the combined PR stats comment below (#400) — mirrors
    # report_benchmark_stats/report_ci_duration_stats above. Needs every
    # shard/leg across all three profiled suites (visual, BDD, system), not
    # just visual+system like those two, since it's the only one of the
    # three that also covers BDD.
    needs: [prep, build_ci_image, merge_visual_reports, merge_bdd_reports, test_system]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # generate-memory-stats.mjs pushes the raw per-shard/leg timeseries and
      # HTML report to gh-pages (a static asset next to the mem-profile
      # history data it already publishes there).
      contents: write
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci-duration.yml, cleanup-video-galleries.yml) so pushes are
      # serialized repo-wide, not just within this workflow/ref (#380).
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch gh-pages baseline
        # Tolerate the branch not existing yet (first run, before any memory
        # profile has ever published), but let real fetch failures (auth,
        # network) fail the job instead of silently proceeding without a
        # baseline.
        run: |
          set +e
          git ls-remote --exit-code origin gh-pages >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          elif [ "$status" -eq 2 ]; then
            echo "gh-pages branch not found on remote; continuing without a baseline"
          else
            exit "$status"
          fi

      - name: Download memory profile results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mem-profile-*-raw-*
          path: mem-profile-raw
          merge-multiple: true

      - name: Generate memory profiling stats
        run: node scripts/generate-memory-stats.mjs memory-stats.md mem-profile-raw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload memory profiling stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-stats-memory
          path: memory-stats.md

  report_coverage_stats:
    # Publishes the vitest html coverage report to gh-pages and renders this
    # PR's coverage section as markdown, for report_pr_stats to fold into the
    # combined PR stats comment below — mirrors report_benchmark_stats above,
    # instead of test_unit publishing/posting its own.
    needs: [prep, build_ci_image, test_unit]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # generate-coverage-stats.mjs pushes the html coverage report to
      # gh-pages (GitHub Pages is enabled for this repo), so it's directly
      # browsable instead of only downloadable as a workflow artifact.
      contents: write
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci-duration.yml, cleanup-video-galleries.yml) so pushes are
      # serialized repo-wide, not just within this workflow/ref (#380).
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download coverage report
        # Tolerate test_unit having produced no unit-coverage artifact at all
        # (e.g. the run crashed before vitest wrote any report) — leaves
        # coverage/ empty, which generate-coverage-stats.mjs already handles
        # the same way it handles a missing coverage-summary.json.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-coverage
          path: coverage

      - name: Generate coverage stats
        run: node scripts/generate-coverage-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload coverage stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-stats-coverage
          path: coverage-stats.md

  report_backend_coverage_stats:
    # Publishes the genhtml backend coverage report (collect_backend_coverage)
    # to gh-pages and renders this PR's backend coverage section as markdown,
    # for report_pr_stats to fold into the combined PR stats comment below —
    # mirrors report_coverage_stats above, for the C++ backend's gcov/lcov
    # data instead of vitest's.
    needs: [prep, build_ci_image, collect_backend_coverage]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      # generate-backend-coverage-stats.mjs pushes the genhtml report to
      # gh-pages (GitHub Pages is enabled for this repo), so it's directly
      # browsable instead of only downloadable as a workflow artifact.
      contents: write
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci-duration.yml, cleanup-video-galleries.yml) so pushes are
      # serialized repo-wide, not just within this workflow/ref (#380).
      group: gh-pages-publish
      cancel-in-progress: false
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download backend coverage report
        # Tolerate collect_backend_coverage having produced no artifact at
        # all (e.g. every producer job failed before uploading its share) —
        # leaves coverage/backend/ empty, which generate-backend-coverage-stats.mjs
        # already handles the same way it handles a missing lcov.info.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage-final
          path: coverage/backend

      - name: Generate backend coverage stats
        run: node scripts/generate-backend-coverage-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload backend coverage stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-stats-backend-coverage
          path: zz-backend-coverage-stats.md

  report_pr_stats:
    # Joins every pr-stats-* artifact (each one stats-generating job's
    # rendered markdown section — coverage, diagram-generation benchmark,
    # ...) into a single upserted PR comment. Adding a new stat to the
    # comment only means having its job write its own <name>.md and upload
    # it as an artifact named pr-stats-<name>.
    needs:
      [
        prep,
        build_ci_image,
        report_coverage_stats,
        report_backend_coverage_stats,
        report_benchmark_stats,
        report_ci_duration_stats,
        report_memory_stats,
      ]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: *container_config
    permissions:
      pull-requests: write
    steps:
      - *checkout_step

      - name: Download PR stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-stats-*
          path: pr-stats
          merge-multiple: true

      - name: Post combined PR stats comment
        run: node scripts/upsert-pr-stats-comment.mjs pr-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  security_audit:
    needs: [prep, build_ci_image, setup]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Run npm audit
        uses: ./.github/actions/security-audit

  collect_backend_coverage:
    # Merges the many per-invocation .gcda trees test_unit/test_bdd/test_visual/
    # test_syntax/test_system produced while running against the
    # coverage-instrumented backend (see
    # SVSCH_BACKEND_GCOV_ROOT above) into one number, combined with the
    # gtest-only capture from test_backend_coverage. Non-blocking — not in
    # package_extension/pack_npm's `needs` — same "visibility only" contract
    # as test_backend_coverage already had.
    needs:
      [
        prep,
        build_ci_image,
        setup,
        build_backend_coverage,
        test_backend_coverage,
        test_unit,
        test_bdd,
        test_visual,
        test_syntax,
        test_system,
      ]
    if: always() && needs.build_backend_coverage.result == 'success'
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step

      - name: Download Coverage-Instrumented Backend Build Tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-binary-coverage
          path: src/parser/backend_cpp/build-coverage

      - name: Download Backend Runtime Coverage Data
        # A `pattern:` download with zero matches (e.g. every test_* job
        # failed before uploading its coverage-raw) succeeds with nothing
        # downloaded, unlike a `name:`-only download of a missing artifact.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-gcda-*
          path: coverage-raw
          merge-multiple: true

      - name: Download gtest Backend Coverage
        # test_backend_coverage only uploads on success (no `if: always()`),
        # so this artifact may not exist — collect-backend-coverage.mjs treats
        # a missing file as "no gtest contribution" rather than a hard error.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: backend-coverage
          path: gtest-coverage

      - name: Collect and merge backend coverage
        run: node scripts/collect-backend-coverage.mjs gtest-coverage/lcov.info

      - name: Upload Final Backend Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-final
          path: |
            coverage/backend/lcov.info
            coverage/backend/html/**

  package_extension:
    needs:
      [
        prep,
        build_ci_image,
        setup,
        build_extension,
        build_backend,
        build_cli,
        test_backend,
        test_unit,
        merge_visual_reports,
        test_syntax,
        test_bdd,
        test_system,
        security_audit,
      ]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step

      - &download_backend_step
        name: Download Backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-binary
          path: dist

      - *download_cli_step
      - *fix_perms_step

      - name: Package Extension
        run: npm run package
        env:
          SURELOG_AUTO_INSTALL: 1

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: '*.vsix'

  pack_npm:
    needs:
      [
        prep,
        build_ci_image,
        setup,
        build_extension,
        build_backend,
        build_cli,
        test_backend,
        test_unit,
        merge_visual_reports,
        test_syntax,
        test_bdd,
        test_system,
        security_audit,
      ]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - *checkout_step
      - *restore_npm_step
      - *download_dist_step
      - *download_backend_step
      - *download_cli_step
      - *fix_perms_step

      - name: Pack NPM Tarball
        run: npm pack

      - name: Upload Tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: '*.tgz'

  test_global_install:
    needs: [prep, build_ci_image, pack_npm]
    runs-on: ubuntu-latest
    container: *container_config
    steps:
      - name: Download Tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: .

      - name: Install Global Package
        run: |
          TGZ_FILE=$(ls *.tgz | head -n 1)
          sudo npm install -g $TGZ_FILE

      - name: Verify Installation
        run: svsch --help
