name: Validate Changeset

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    # We skip this linter check for:
    # 1. Dependabot PRs because our Dependabot Helper workflow automatically commits a changeset to them.
    # 2. Changeset Release PRs because changesets are consumed when versioning packages.
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Changesets needs git history to compare branches

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check for Changeset
        run: npx changeset status --since=origin/master
