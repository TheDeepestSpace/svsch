name: Update VS Code Version Matrix

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version list
        id: update
        run: |
          node scripts/update-vscode-versions.js
          if [ -n "$(git status --porcelain vscode-versions.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate new screenshots
        if: steps.update.outputs.changed == 'true'
        run: |
          # Install deps for Playwright
          npm ci
          # For every version in the new JSON, ensure screenshots exist
          # (Simplified: just run update-snapshots for all versions)
          chmod -R a+rX /usr/local
          for version in $(cat vscode-versions.json | jq -r '.[]'); do
            echo "Generating screenshots for VS Code $version"
            VSCODE_VERSION=$version npm run test:system:update
          done

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update vscode version matrix and screenshots"
          title: "chore: update vscode version matrix"
          body: "Automated update of VS Code versions for system testing based on the 'latest 3 + decennial' logic."
          branch: automation/update-vscode-versions
          base: main
