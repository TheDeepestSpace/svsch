name: Clean up video galleries

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      # Shared across every job/workflow that pushes to gh-pages (see
      # ci.yml's merge_visual_reports, ci-duration.yml) so pushes are
      # serialized repo-wide instead of racing this job's own ad-hoc
      # retry loop against theirs (#380).
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove galleries for closed PRs
        # Covers both the BDD gallery (dev/bdd-videos) and the system gallery
        # (dev/system-videos, see #294) — same layout and lifecycle, so one
        # sweep handles both instead of two near-identical workflows.
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED_PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gallery_dirs="dev/bdd-videos dev/system-videos"
          branch_prefixes="bdd-videos-pr- system-videos-pr-"

          if [ -n "${CLOSED_PR}" ]; then
            candidates="${CLOSED_PR}"
          else
            candidates=$(
              {
                for prefix in ${branch_prefixes}; do
                  git ls-remote --heads origin "refs/heads/${prefix}*" |
                    sed -n "s#.*refs/heads/${prefix}\([0-9][0-9]*\)\$#\1#p"
                done
                for dir in ${gallery_dirs}; do
                  find "${dir}" -mindepth 1 -maxdepth 1 -type d -name 'pr-[0-9]*' 2>/dev/null |
                    sed -n 's#.*/pr-\([0-9][0-9]*\)$#\1#p'
                done
              } | sort -un
            )
          fi

          closed_prs=""
          for pr_number in ${candidates}; do
            case "${pr_number}" in
              *[!0-9]*|'') echo "Ignoring invalid PR number: ${pr_number}" >&2; continue ;;
            esac
            state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .state)
            if [ "${state}" = "open" ]; then
              continue
            fi
            for dir in ${gallery_dirs}; do
              git rm -r --ignore-unmatch "${dir}/pr-${pr_number}"
            done
            closed_prs="${closed_prs} ${pr_number}"
          done

          if ! git diff --cached --quiet; then
            git commit -m "Remove video galleries for closed PRs"
            attempt=1
            while ! git push origin HEAD:gh-pages; do
              if [ "$attempt" -ge 3 ]; then
                echo "Failed to update gh-pages after ${attempt} attempts" >&2
                exit 1
              fi
              attempt=$((attempt + 1))
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
          fi

          for pr_number in ${closed_prs}; do
            for prefix in ${branch_prefixes}; do
              media_branch="${prefix}${pr_number}"
              if git ls-remote --exit-code --heads origin "refs/heads/${media_branch}" >/dev/null 2>&1; then
                git push origin --delete "${media_branch}"
              fi
            done
          done
